name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Testes
        run: pytest
